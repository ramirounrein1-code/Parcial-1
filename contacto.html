<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Contacto - Ramiro Unrein</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="contacto.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <!-- NAVEGACION DE BOOTSTRAP -->
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand" href="index.html">Inicio</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="trabajos.html">Trabajos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="sobre-mi.html">Sobre mí</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">Contacto</a>
                    </li>
                </ul>
            </div>
        </nav>

    </header>

    <main>

        <!-- PORTADA -->
        <section class="portada">

            <article class="texto">

                <h1> Contacto

                </h1>

                <p> Disponible para proyectos freelance, colaboraciones creativas y oportunidades laborales. </p>

                <p> Para más información <a href="https://workspace.google.com/intl/es/gmail/">ramirounrein1@gmail.com
                    </a> </p>

            </article>

            <!-- input type= "text" para escribir texto en una sola linea -->
            <form class="formulario-contacto">
                <input class="form-control campo" type="text" placeholder="Nombre">
                <input class="form-control campo" type="email" placeholder="Correo electrónico">
                <textarea class="form-control campo mensaje" placeholder="Comentario"></textarea>

                <!-- Boton enviar Bootstrap -->
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
                    Enviar
                </button>

                <!-- Mensaje que aparece cuando tocas enviar -->
                <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h1 class="modal-title fs-5" id="exampleModalLabel">¿Quiere confirmar el mensaje?</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary"
                                    data-bs-dismiss="modal">Cancelar</button>
                                <button type="button" class="btn btn-primary-enviar">Enviar</button>
                            </div>
                        </div>
                    </div>
                </div>

                </div>

            </form>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
